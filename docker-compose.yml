services:
  # PyTorch models behind a FastAPI REST API. Only reachable inside the
  # compose network; uncomment `ports` to use the Swagger UI at :8000/docs.
  inference:
    build: ./inference
    # ports:
    #   - "8000:8000"
    healthcheck:
      # slim image has no curl -> use Python's stdlib
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # Flask UI. Talks to the inference service by its compose service name.
  webapp:
    build: ./webapp
    ports:
      - "5000:5000"
    environment:
      INFERENCE_URL: http://inference:8000
    depends_on:
      inference:
        condition: service_healthy   # wait until models are loaded
    restart: unless-stopped
